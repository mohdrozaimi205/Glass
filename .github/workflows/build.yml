name: Bina APK Glass

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Uji dan bina APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Namakan APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Glass.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Glass-apk
          path: Glass.apk

      - name: Terbitkan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Glass v1.1.${{ github.run_number }}
          body: APK launcher Glass (liquid glass) dengan animasi baru. Muat turun Glass.apk dan pasang di telefon.
          files: Glass.apk
